<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Explanation multiplicity bench</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(860px,100% - 32px);margin:64px auto 96px}

// What is real: the README's headline flip rate F = 0.7316 (15,840 pre-registered specifications, 7,561 of which
// produced a claim) and that a specification has seven axes. Everything else here is illustrative: the knob
// positions and the two claim cards are drawn to show the idea, not taken from the sweep.

const F_REAL = 0.7316;
const AXES = 7;
const SPECS = 15840;
const CLAIMS = 7561;

// Knob angles in radians for analyst A and analyst B. Illustrative: B differs from A on four of the seven axes.
const KNOB_A = [-1.6, 0.4, 1.2, -0.5, 0.9, -1.1, 0.3];
const KNOB_B = [-1.6, 1.3, 1.2, 0.8, -0.7, -1.1, 1.8];
// Illustrative claim cards: three bar lengths each.
const CLAIM_A = [14, 7, 10];
const CLAIM_B = [6, 14, 9];

const clamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
const seg = (u, a, b) => clamp((u - a) / (b - a));
const ease = (t) => t * t * (3 - 2 * t);
const wave = (u, a, b) => Math.sin(Math.PI * seg(u, a, b));

const CYCLE = 24;
const T = {
  knobA: [0.02, 0.2],
  knobB: [0.2, 0.38],
  cardA: [0.4, 0.62],
  cardB: [0.46, 0.68],
  flow: [0.7, 0.78],
  needle: [0.78, 0.95],
  fade: [0.985, 1.0],
};

const X0 = -92; // card start
const XP = -20; // under the press
const X1 = 58; // comparison slot

function carriage(u, [a, b]) {
  const s = seg(u, a, b);
  const x = s < 0.4 ? X0 + (XP - X0) * ease(s / 0.4) : s < 0.6 ? XP : XP + (X1 - XP) * ease((s - 0.6) / 0.4);
  return { x, shown: u >= a, press: wave(s, 0.4, 0.6), printed: seg(s, 0.46, 0.6) };
}

function pose(u) {
  const fadeOut = 1 - seg(u, T.fade[0], T.fade[1]);
  const ca = carriage(u, T.cardA);
  const cb = carriage(u, T.cardB);
  const ka = seg(u, ...T.knobA);
  const kb = seg(u, ...T.knobB);
  return {
    u,
    fade: fadeOut,
    knobA: KNOB_A.map((t, i) => t * ease(clamp(ka * (AXES + 2) - i * 0.9, 0, 1))),
    knobB: KNOB_B.map((t, i) => t * ease(clamp(kb * (AXES + 2) - i * 0.9, 0, 1))),
    cardA: ca,
    cardB: cb,
    pressA: ca.press,
    pressB: cb.press,
    flow: seg(u, ...T.flow) * (u < 0.95 ? 1 : 0.4),
    needle: F_REAL * ease(seg(u, ...T.needle)),
  };
}

function describe(u) {
  const p = pose(u);
  if (u < T.knobA[1]) return `analyst A sets ${AXES} axes`;
  if (u < T.knobB[1]) return `analyst B sets ${AXES} axes, a little differently`;
  if (u < T.cardB[1]) return "same instrument, same prompts: each stamps a claim";
  if (u < T.needle[0]) return "two claims side by side";
  if (u < T.fade[0]) return `claim flip rate F = ${p.needle.toFixed(4)}`;
  return "ready for the next pair";
}

    out.push(S(k.slabOf(slot, 0, 0.8, P, 4, 0.3), { tone: "lo", crease: "none" }));
    out.push(L(k.planOutline(k.insetPlan(slot, 2), 0.8, P, 4), { tone: "faint" }));

  return out.join("");
}

function panel(P, plan, angles) {
  const { PANEL_H, KNOB_X } = W;
  const y = plan.y + plan.d / 2;
  const out = [`<path class="iso-halo" d="${k.haloOf(plan, 0, PANEL_H, P)}" style="filter:blur(4px)"/>`];
  out.push(S(k.slabOf(plan, 0, PANEL_H, P, 5, 0.7), { tone: "mid" }));
  out.push(L(k.planOutline(k.insetPlan(plan, 2.2), PANEL_H, P, 4), { tone: "faint" }));
  out.push(D(k.corners(plan, 2.4).map(([x, yy]) => at(P, [x, yy, PANEL_H])), { size: 0.4 }));
  return { shell: out.join(""), y, knobs: (a) => knobs(P, y, a) };
}

function knobs(P, y, angles) {
  const { PANEL_H, KNOB_X } = W;
  const out = [];
  angles.forEach((a, i) => {
    const x = KNOB_X(i);
    out.push(S(k.cylinder(x, y, 3.3, PANEL_H, 3.2, P, 24, 0.3), { tone: "mid" }));
    out.push(L(k.knurl(x, y, 3.3, PANEL_H, PANEL_H + 3.2, 14, P), { tone: "lo" }));
    out.push(L(k.lineOnTop([x, y], [x + Math.sin(a) * 3.3, y - Math.cos(a) * 3.3], PANEL_H + 3.2, P), { tone: "lit" }));
  });
  return out.join("");
}

const panelA = (P) => panel(P, W.PANEL_A);
const panelB = (P) => panel(P, W.PANEL_B);
const knobsA = (P, angles) => knobs(P, W.YA, angles);
const knobsB = (P, angles) => knobs(P, W.YB, angles);

// the shared instrument: a gantry that straddles both belts, with one press head over each
function post(P, y) {
  const out = [];
  const plan = { x: W.BEAM.x, y: y - 4, w: W.BEAM.w, d: 8, r: 1.6 };
  out.push(S(k.slabOf(plan, 0, W.BEAM_Z, P, 4, 0.6), { tone: "mid" }));
  out.push(L([8, 22].map((z) => k.sideSeam(plan, z, P, 4)).join(""), { tone: "faint" }));
  out.push(D([at(P, [plan.x + 3.5, plan.y + 4, W.BEAM_Z]), at(P, [plan.x + plan.w - 3.5, plan.y + 4, W.BEAM_Z])], { size: 0.4 }));
  return out.join("");
}
const postBack = (P) => post(P, W.BEAM.y + 4);
const postFront = (P) => post(P, W.BEAM.y + W.BEAM.d - 4);

function beam(P) {
  const { BEAM, BEAM_Z } = W;
  const out = [S(k.slabOf(BEAM, BEAM_Z, 8, P, 4, 0.6), { tone: "mid" })];
  out.push(L(k.planOutline(k.insetPlan(BEAM, 2.4), BEAM_Z + 8, P, 4), { tone: "faint" }));
  out.push(k.faceTextSvg(k.topMatrix([BEAM.x + 2.4, BEAM.y + 100], BEAM_Z + 8, P, "y"), "auto-circuit", { size: 3.4, tone: "mid" }));
  out.push(D([at(P, [BEAM.x + 5, BEAM.y + 4, BEAM_Z + 8]), at(P, [BEAM.x + 5, BEAM.y + BEAM.d - 4, BEAM_Z + 8])], { size: 0.45 }));
  return out.join("");
}

function head(P) {
  const { HEAD_X } = W;
  const y = 0;
  const out = [];
  out.push(S(k.cylinder(HEAD_X, y, 2.4, 14, W.BEAM_Z - 14, P, 20), { tone: "mid", crease: "none" }));
  out.push(S(k.cylinder(HEAD_X, y, 7, 8, 7, P, 28, 0.5), { tone: "hi", lit: true }));
  out.push(L(k.knurl(HEAD_X, y, 7, 8, 15, 22, P), { tone: "lo" }));
  return out.join("");
}

// a belt card: a slip carrying one analyst's claim. `bars` are the printed lengths, `printed` 0..1 how much is stamped.
function card(P, x, y, bars, printed, op = 1) {
  if (op <= 0.003) return "";
  const { w, d } = W.CARD;
  const z = 1.6;
  const plan = { x: x - w / 2, y: y - d / 2, w, d, r: 1.2 };
  const out = [S(k.slabOf(plan, z, 1.2, P, 4, 0.3), { tone: "hi", lit: true, crease: "lo" })];
  const top = z + 1.2;
  bars.forEach((len, i) => {
    const yy = y - d / 2 + 3.4 + i * 4.2;
    const l = len * printed;
    if (l > 0.4) out.push(L(k.lineOnTop([x - w / 2 + 2.6, yy], [x - w / 2 + 2.6 + l, yy], top, P), { tone: "lo", free: true }));
  });
  out.push(D([at(P, [x + w / 2 - 2.2, y - d / 2 + 2.2, top])], { size: 0.45, tone: "hi" }));
  return opaque(out.join(""), op);
}

// the comparator: a dial gauge on a post, reading the flip rate
function gauge(P) {
  const [x, y] = W.GAUGE;
  const { GAUGE_R: R, GAUGE_Z: Z, GAUGE_H: H, A0, SPAN } = W;
  const top = Z + H;
  const out = [];
  const foot = { x: x - 15, y: y - 15, w: 30, d: 30, r: 3 };
  out.push(`<path class="iso-halo" d="${k.haloOf(foot, 0, 4, P)}" style="filter:blur(4px)"/>`);
  out.push(S(k.slabOf(foot, 0, 4, P, 5, 0.6), { tone: "mid" }));
  out.push(D(k.corners(foot, 3).map(([a, b]) => at(P, [a, b, 4])), { size: 0.4 }));
  out.push(S(k.cylinder(x, y, 4.2, 4, Z - 4, P, 24), { tone: "mid", crease: "none" }));
  out.push(L(k.sideArc(x, y, 4.2, 14, P, 14), { tone: "faint" }));
  out.push(S(k.cylinder(x, y, R, Z, H, P, 56, 0.8), { tone: "hi", crease: "lo" }));
  out.push(L(k.knurl(x, y, R, top - 3.2, top, 76, P, 0.3), { tone: "lo" }));
  out.push(L(k.ring(x, y, R - 2.2, top, P, 56), { tone: "lo" }));
  const ticks = k.radialTicks(x, y, R - 3, 50, 5, top, [1.3, 2.8], P, A0, SPAN);
  out.push(L(ticks.minor, { tone: "lo" }), L(ticks.major, { tone: "mid" }));
  out.push(L(k.ring(x, y, 1.6, top, P, 16), { tone: "mid" }));
  const lab = (a, text) => k.faceTextSvg(k.topMatrix([x + Math.sin(a) * (R - 8.2), y - Math.cos(a) * (R - 8.2) + 1.1], top, P, "x"), text, { size: 2.8, tone: "mid", anchor: "middle" });
  out.push(lab(A0, "0"), lab(A0 + SPAN, "1"));
  out.push(k.faceTextSvg(k.topMatrix([x, y + 9.4], top, P, "x"), "F", { size: 3.2, tone: "hi", anchor: "middle" }));
  return out.join("");
}

function needleD(P, v) {
  const [x, y] = W.GAUGE;
  const { GAUGE_R: R, GAUGE_Z: Z, GAUGE_H: H, A0, SPAN } = W;
  const a = A0 + SPAN * v;
  return k.lineOnTop([x - Math.sin(a) * 3.4, y + Math.cos(a) * 3.4], [x + Math.sin(a) * (R - 4.4), y - Math.cos(a) * (R - 4.4)], Z + H + 0.2, P);
}

// wires from the two slots to the gauge post, animated while the two claims are compared
function wires(P, flow) {
  const [gx, gy] = W.GAUGE;
  const out = [];
  for (const y of [W.YA, W.YB]) {
    const pt = (q) => at(P, q);
    out.push(k.wireSvg(pt([W.SLOT_X + 38, y, 0.8]), pt([gx - 5, gy + Math.sign(y) * 5, 10]), { via: [pt([gx - 20, y, 0.8]), pt([gx - 5, y, 0.8])], tone: "lo", dotted: true, flow: flow > 0.5 }));
  }
  return opaque(out.join(""), 0.25 + 0.75 * flow);
}


const P = {"origin":[393.08420963255463,183.74700816785884],"scale":1.5480568692763264,"azimuth":62,"elevation":30};
const REST = 0.975;
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const part = (name) => svg.querySelector('[data-part="' + name + '"]');
const E = { kA: part("knobsA"), kB: part("knobsB"), cA: part("cardA"), cB: part("cardB"), hA: part("headA"), hB: part("headB"), wires: part("wires"), needle: part("needle") };

const put = (key, node, html) => { if (cache[key] !== html) { cache[key] = html; node.innerHTML = html; } };

let u = still.matches ? REST : 0, target = u, touring = !still.matches, frame = 0, last = 0, visible = false, idleTimer = 0;

function render() {
  const p = pose(u);

  put("kB", E.kB, knobsB(P, r2(p.knobB)));
  put("cA", E.cA, p.cardA.shown ? card(P, Math.round(p.cardA.x * 4) / 4, W.YA, CLAIM_A, Math.round(p.cardA.printed * 40) / 40, p.fade) : "");
  put("cB", E.cB, p.cardB.shown ? card(P, Math.round(p.cardB.x * 4) / 4, W.YB, CLAIM_B, Math.round(p.cardB.printed * 40) / 40, p.fade) : "");
  E.hA.setAttribute("transform", translateAlong(P, [0, W.YA, -4 * p.pressA]));
  E.hB.setAttribute("transform", translateAlong(P, [0, W.YB, -4 * p.pressB]));
  put("wires", E.wires, wires(P, Math.round(p.flow * 20) / 20));
  E.needle.setAttribute("d", needleD(P, p.needle));

}

function tick(now) {

  last = now;

  else { u = still.matches ? target : u + (target - u) * (1 - Math.exp(-dt / 0.12)); if (Math.abs(target - u) < 0.0004) u = target; }

const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };

new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
stage.addEventListener("pointermove", (event) => {

});
stage.addEventListener("pointerleave", () => { clearTimeout(idleTimer); idleTimer = setTimeout(() => { touring = !still.matches; run(); }, 1200); });
stage.addEventListener("click", () => { u = target = 0; touring = !still.matches; if (still.matches) u = target = REST; clearTimeout(idleTimer); render(); run(); });
stage.addEventListener("keydown", (event) => {
  const key = event.key;
  if (key === "ArrowRight" || key === "ArrowUp") target = clamp(target + 0.03, 0, 0.995);
  else if (key === "ArrowLeft" || key === "ArrowDown") target = clamp(target - 0.03, 0, 0.995);
  else if (key === "Home") target = 0;
  else if (key === "End") target = REST;

window.__set = (uu) => { u = target = uu; touring = false; render(); };
render();
